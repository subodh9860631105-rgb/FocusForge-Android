name: Build FocusForge Pro APK

on:
  push:
    branches: [ "main", "arena/**", "feature/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Organize Files & Generate Android Configs
        run: |
          mkdir -p app/src/main/java/com/focusforge/pro

          # Copy every Kotlin source in the repo into the Gradle source set.
          find . -name "*.kt" \
            -not -path "./.git/*" \
            -not -path "*/build/*" \
            -not -path "./app/src/main/java/*" | while read -r f; do
              echo "  -> $f"
              cp "$f" app/src/main/java/com/focusforge/pro/
            done

          f1=$(find . -name "AndroidManifest.xml" -not -path "./.git/*" | head -n 1)
          if [ -n "$f1" ] && [ "$f1" != "./app/src/main/AndroidManifest.xml" ]; then cp "$f1" app/src/main/AndroidManifest.xml; fi

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FocusForgePro"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.focusforge.pro'
              compileSdk 34
              defaultConfig {
                  applicationId "com.focusforge.pro"
                  minSdk 26
                  targetSdk 34
                  versionCode 3
                  versionName "3.0-Pro"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          mkdir -p app/src/main/res/xml
          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewScrolled|typeViewClicked|typeViewSelected"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds|flagRetrieveInteractiveWindows"
              android:notificationTimeout="15"
              android:canRetrieveWindowContent="true" />
          EOF

          cat << 'EOF' > app/src/main/res/xml/device_admin_policies.xml
          <?xml version="1.0" encoding="utf-8"?>
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies>
                  <force-lock />
              </uses-policies>
          </device-admin>
          EOF

          mkdir -p app/src/main/res/drawable
          cat << 'EOF' > app/src/main/res/drawable/ic_app_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path android:fillColor="#4F46E5" android:pathData="M12,1L3,5v6c0,5.55 3.84,10.74 9,12 5.16,-1.26 9,-6.45 9,-12V5l-9,-4z"/>
              <path android:fillColor="#10B981" android:pathData="M10,17l-4,-4 1.41,-1.41L10,14.17l6.59,-6.59L18,9l-8,8z"/>
          </vector>
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Capture compile errors (temporary debug)
        if: failure()
        run: |
          gradle assembleDebug --no-daemon > build-log.txt 2>&1 || true
          { echo "## build errors"; grep -E "^e: |error:|FAILURE:" build-log.txt | head -60; } > build-errors.md
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f build-errors.md
          git commit -m "ci: capture compile errors [skip ci]" || true
          git push || true

      - name: Publish APK to dist/ (downloadable from the repo)
        if: success() && github.event_name == 'push'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/FocusForge-Pro-debug.apk
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f dist/FocusForge-Pro-debug.apk
          if git diff --cached --quiet; then echo "no APK change"; exit 0; fi
          git commit -m "build: publish FocusForge-Pro-debug.apk [skip ci]"
          git push || true

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusForge-Pro-Installable-APK
          path: app/build/outputs/apk/debug/app-debug.apk
