name: Build FocusForge Pro APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools platforms;android-34 build-tools;34.0.0

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Create Gradle Project Structure
      run: |
        mkdir -p app/src/main/java/com/focusforge/pro
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/xml

        if [ -f app/src/main/MainActivity.kt ]; then
          mv app/src/main/MainActivity.kt app/src/main/java/com/focusforge/pro/MainActivity.kt
        fi

        if [ -f app/src/main/FocusAccessibilityService.kt ]; then
          mv app/src/main/FocusAccessibilityService.kt app/src/main/java/com/focusforge/pro/FocusAccessibilityService.kt
        fi

        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">FocusForge Pro</string>
            <string name="accessibility_service_description">FocusForge Pro Shield monitors active windows to block YouTube Shorts, Reels, and distracting apps during study sessions.</string>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
        <?xml version="1.0" encoding="utf-8"?>
        <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewScrolled"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds|flagRetrieveInteractiveWindows"
            android:canRetrieveWindowContent="true"
            android:description="@string/accessibility_service_description"
            android:notificationTimeout="100" />
        EOF

        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application' version '8.5.0'
            id 'org.jetbrains.kotlin.android' version '1.9.24'
        }
        android {
            namespace 'com.focusforge.pro'
            compileSdk 34
            defaultConfig {
                applicationId 'com.focusforge.pro'
                minSdk 24
                targetSdk 34
                versionCode 2
                versionName "2.0-Pro"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "FocusForge-Android"
        include ':app'
        EOF

        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FocusForge-Pro-Installable-APK
        path: app/build/outputs/apk/debug/app-debug.apk
